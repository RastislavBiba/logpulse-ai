name: CI/CD Pipeline - Test, Build & Push

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitára
        uses: actions/checkout@v4

      - name: Nastavenie Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Inštalácia závislostí
        run: pip install -r requirements.txt

      - name: Spustenie testov
        run: pytest

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitára
        uses: actions/checkout@v4

      - name: Prihlásenie do GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nastavenie Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build a Push obrazu
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/rastislavbiba/logpulse-ai:latest
